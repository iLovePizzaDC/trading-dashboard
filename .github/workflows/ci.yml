name: CI & Deploy

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]
    workflow_dispatch:
permissions:
    contents: read

jobs:
    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run type-check

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run lint

    security:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm audit --audit-level=high --omit=dev

    build:
        needs: [typecheck, lint, security]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run build
            - uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist
                  retention-days: 1

    deploy:
        needs: build
        runs-on: self-hosted
        if: |
            github.ref == 'refs/heads/main' &&
            github.event_name == 'push' &&
            github.actor == 'google-release-please[bot]'
        steps:
            - uses: actions/download-artifact@v4
              with:
                name: dist
                path: dist
            - name: Backup current deployment
              run: |
                rm -rf /var/www/trading.bak
                cp -r /var/www/trading /var/www/trading.bak || true
            - name: Copy dist to nginx
              run: |
                find /var/www/trading -mindepth 1 -maxdepth 1 ! -name 'data' -exec rm -rf {} +
                cp -r dist/* /var/www/trading/
            - name: Health Check
              id: healthcheck
              run: sleep 5 && curl --fail --retry 3 --retry-delay 2 https://trading.migrainetracker.de
            - name: Rollback on failure
              if: failure()
              run: |
                find /var/www/trading -mindepth 1 -maxdepth 1 ! -name 'data' -exec rm -rf {} +
                cp -r /var/www/trading.bak/* /var/www/trading/
                echo "Rollback completed"
