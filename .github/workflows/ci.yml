name: CI & Deploy

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/Ref for build (empty = current branch)'
        required: false
        type: string
      deploy:
        description: 'Deploy after build?'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read

jobs:
  security-secrets:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run type-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

  build:
    needs: [typecheck, lint, test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: self-hosted
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Backup current version
        run: |
          rm -rf /var/www/trading.bak
          mkdir -p /var/www/trading.bak
          rsync -a --exclude 'data' /var/www/trading/ /var/www/trading.bak/

      - name: Deploy
        run: |
          rsync -a --delete --exclude 'data' dist/ /var/www/trading/

      - name: Health check
        run: |
          curl --fail --retry 20 --retry-delay 2 https://trading.migrainetracker.de

      - name: Rollback on failure
        if: failure()
        run: |
          rsync -a --delete --exclude 'data' /var/www/trading.bak/ /var/www/trading/
